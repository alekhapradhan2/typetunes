<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Lush Green Gradient matching reference image -->
    <radialGradient id="greenGlow" cx="35%" cy="30%" r="70%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="45%" stop-color="#22C55E" />
      <stop offset="85%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#052e16" flood-opacity="0.25" />
    </filter>
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#34D399" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Main Circular Disc -->
  <circle cx="30" cy="34" r="26" fill="url(#greenGlow)" filter="url(#softGlow)" />
  
  <!-- Subtle inner top highlight border -->
  <circle cx="30" cy="34" r="25.25" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Musical Eighth Note (Hollow loop + vertical stem + angled flag) -->
  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Notehead Loop (Hollow circle at bottom left) -->
    <circle cx="25" cy="39" r="5" />
    
    <!-- Stem and Flag -->
    <path d="M30 39 V21 L41 27" />
  </g>

  <!-- Accent Indicator Dot in Top-Right -->
  <circle cx="53" cy="11" r="5.5" fill="#5EEAD4" filter="url(#dotGlow)" />
  <circle cx="53" cy="11" r="5" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" />
</svg>
